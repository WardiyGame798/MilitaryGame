<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ZSU-23-4 SHILKA — KHU VỰC TÁC CHIẾN</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- SẢNH CHÍNH TÁC CHIẾN -->
  <section id="lobby-screen" aria-label="Sảnh tác chiến">
    <div class="lobby-inner">
      <p class="tac-code">KHU VỰC TÁC CHIẾN // PHÒNG KHÔNG TẦM THẤP</p>
      <h1>ZSU-23-4 SHILKA</h1>
      <p class="tac-brief">Trực ban đánh chặn mục tiêu bay thấp. Khung thử nghiệm giao diện và điều khiển.</p>

      <button type="button" id="btn-start-game" class="btn-primary">Bắt đầu chơi</button>
    </div>
  </section>

  <!-- MÀN HÌNH TRONG TRẬN -->
  <main id="battle-screen" aria-label="Màn hình tác chiến" hidden>
    <!-- Thanh thông tin trên đầu: Mục tiêu hạ gục & Lượng đạn -->
    <header id="hud-top" aria-label="Thông tin chiến đấu trên đầu">
      <div class="hud-stat" id="hud-kills">Đã triệt hạ: <span id="kill-count">0</span></div>
      <div class="hud-stat" id="hud-ammo">Đạn còn lại: <span id="ammo-count">--</span></div>
      <button type="button" id="btn-back-lobby">Về sảnh</button>
    </header>

    <!-- Khung cảnh chính & tâm ngắm -->
    <section id="battle-viewport" aria-label="Khung cảnh trận địa">
      <div id="scene-placeholder">Khu vực địa hình & khí tài (Chờ nạp mô-đun)</div>
      <div id="optical-reticle" aria-hidden="true">+</div>
    </section>

    <!-- Góc trên bên phải: Radar quét & danh sách độ cao mục tiêu đánh số -->
    <aside id="radar-widget" aria-label="Radar và danh sách mục tiêu">
      <button type="button" id="btn-toggle-radar">Mở / Tắt Radar</button>
      <canvas id="radar-pad" width="170" height="170"></canvas>
      <div id="radar-targets-list" aria-live="polite">
        <p class="radar-note">Chưa có mục tiêu được đánh số.</p>
      </div>
    </aside>

    <!-- Bên trái: Vòng điều khiển di chuyển (kéo tay/chuột theo hướng) -->
    <section id="move-pad-zone" aria-label="Điều khiển di chuyển">
      <div id="move-joystick" role="application" aria-label="Vòng tròn điều khiển di chuyển">
        <div id="move-stick-knob" aria-hidden="true"></div>
      </div>
      <p id="move-direction-readout" class="sr-only">Hướng di chuyển: Đứng yên</p>
    </section>

    <!-- Bên phải: Cụm nút điều khiển tháp pháo, nòng, bắn, ống ngắm -->
    <section id="weapon-pad-zone" aria-label="Điều khiển hỏa lực và góc nhìn">
      <button type="button" id="btn-turret-left">Xoay tháp trái</button>
      <button type="button" id="btn-turret-right">Xoay tháp phải</button>
      <button type="button" id="btn-barrel-up">Ngẩng pháo</button>
      <button type="button" id="btn-barrel-down">Chúi pháo</button>
      <button type="button" id="btn-fire-cannon">Bắn</button>
      <button type="button" id="btn-toggle-scope">Mở ống ngắm</button>
    </section>

    <!-- Vùng thông báo ngắn cho trình đọc màn hình -->
    <div id="sr-status" aria-live="polite" aria-atomic="true"></div>
  </main>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="terrain3d.js"></script>
  <script src="shilka3d.js"></script>
  <script src="game.js"></script>
</body>
</html>
